<style>
:root{--bg:#F6F0E4;--ink:#221A17;--mu:#6E5F55;--ru:#E3D6C4;--ac:#7A2E2A;--err:#9A2B22}
@media (prefers-color-scheme:dark){:root{--bg:#2A1716;--ink:#F1E6D6;--mu:#B49A8C;--ru:#45292A;--ac:#D98B7A;--err:#F0A091;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right))}
main{width:min(420px,100%)}
.mark{font-size:30px;font-weight:500;margin:0}.mark i{color:var(--ac)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
h1{font-style:italic;font-weight:400;font-size:clamp(40px,10vw,56px);line-height:1;margin:40px 0 0}
p.lead{font-size:20px;font-weight:500;line-height:1.5;margin:16px 0 32px}
label{display:block;margin-bottom:8px}
input{width:100%;font:italic 400 24px 'Cormorant Garamond',Georgia,serif;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ru);padding:8px 0;outline:none;border-radius:0}
input:focus{border-bottom-color:var(--ac)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:24px}
button{min-height:52px;padding:0 26px;border:0;border-radius:999px;background:var(--ac);color:var(--bg);font:500 13px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button[disabled]{opacity:.6;cursor:default}
.keep{display:inline-flex;align-items:center;gap:8px;text-transform:none;letter-spacing:.02em;cursor:pointer}
.keep input{width:auto;accent-color:var(--ac)}
.msg{min-height:20px;margin:16px 0 0;font:400 13px 'IBM Plex Mono',monospace;color:var(--err)}
.foot{margin-top:56px;border-top:1px solid var(--ru);padding-top:12px}
@media (prefers-reduced-motion:no-preference){main{animation:settle 1.1s cubic-bezier(.4,0,.2,1)}@keyframes settle{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
